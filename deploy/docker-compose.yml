# The stack on the Hostinger VPS. Run from the repository root:
#   docker compose --project-directory . -f deploy/docker-compose.yml up -d
# Traefik already runs on the server (ports 80 and 443, Let's Encrypt): the labels below
# publish this stack through it. Values come from the server's .env (see .env.example).
name: noisemap

services:
  api:
    image: noisemap-api:${NOISEMAP_TAG:-local}
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    environment:
      DATA_BUILD_DIR: /data/build/current
      WORKSPACES_DIR: /data/workspaces
      # Compiled layout code is kept between restarts: the first refresh does not recompile.
      NUMBA_CACHE_DIR: /data/workspaces/.numba
      # A layout runs in a process of its own, on one of the two cores at most: the other
      # stays for the embedding model.
      NUMBA_NUM_THREADS: "1"
      EMBEDDING_API_BASE: http://ollama:11434/v1
      EMBEDDING_API_KEY: ollama
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION}
      LLM_API_BASE: ${HOSTINGER_ROUTER_API_BASE:-https://router.hostinger.com/v1}
      LLM_API_KEY: ${HOSTINGER_ROUTER_API_KEY_PROD:-}
      LLM_MODEL: ${LLM_MODEL:-}
      # Web reader for pasted links. Empty: the paste box takes text only.
      CONTEXT_DEV_API_KEY: ${CONTEXT_DEV_API_KEY:-}
      GIT_COMMIT: ${NOISEMAP_TAG:-local}
    volumes:
      # Map builds are made offline and copied here; they never go through git.
      - ./data/build:/data/build:ro
      # Written by the server: the workspaces of the users, their keys, the embedding cache.
      - ./data/workspaces:/data/workspaces
    depends_on:
      - ollama
    mem_limit: 3000m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - traefik.enable=true
      - traefik.http.routers.noisemap-api.rule=Host(`${NOISEMAP_HOST}`) && PathPrefix(`/api`)
      - traefik.http.routers.noisemap-api.entrypoints=websecure
      - traefik.http.routers.noisemap-api.tls.certresolver=letsencrypt
      - traefik.http.services.noisemap-api.loadbalancer.server.port=8000

  web:
    image: noisemap-web:${NOISEMAP_TAG:-local}
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    labels:
      - traefik.enable=true
      - traefik.http.routers.noisemap-web.rule=Host(`${NOISEMAP_HOST}`)
      - traefik.http.routers.noisemap-web.entrypoints=websecure
      - traefik.http.routers.noisemap-web.tls.certresolver=letsencrypt
      - traefik.http.services.noisemap-web.loadbalancer.server.port=80

  # The embedding model, local mode: the same open weights that embedded the corpus offline.
  # Not published: only the API reaches it.
  ollama:
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama
    mem_limit: 2500m
    # The model needs both cores to itself: measured here, posts were embedded at 1 a second
    # instead of 8, and a search took 7 seconds, while a layout was compiling in the API
    # container. With eight times the weight of the others, it kept 6 to 7 a second.
    cpu_shares: 8192

volumes:
  ollama:
