[project]
name = "noisemap"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic-settings>=2.4",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
pipelines = [
    "scikit-learn>=1.9.1",
    "umap-learn>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["demos", "frontend", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
